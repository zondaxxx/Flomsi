name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core
      - run: cargo build --release -p mailctl
        working-directory: core
      - uses: actions/upload-artifact@v4
        with:
          name: mailctl-linux-x86_64
          path: core/target/release/mailctl

  live:
    name: core against Dovecot and mailpit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: start the mail servers
        run: scripts/live_servers.sh
      - run: cargo test -p mailcore --test live -- --nocapture --test-threads 4
        working-directory: core
        env:
          FLOMSI_LIVE: "1"
      - name: mailctl against the same servers
        working-directory: core
        env:
          MAIL_PASSWORD: Live-Pw-9431
        run: |
          cargo build -p mailctl
          M="target/debug/mailctl --data-dir /tmp/flomsi-mailctl"
          $M probe --email smoke@flomsi.test --host localhost --port 10993 --local-bridge
          $M probe --email smoke@flomsi.test --host localhost --port 10143 --starttls --local-bridge --quick
          $M test-login --email smoke@flomsi.test --host localhost --port 10993 --local-bridge
          $M check-smtp --email smoke@flomsi.test --host localhost --port 1025 --local-bridge
          if MAIL_PASSWORD=wrong $M test-login --email smoke@flomsi.test --host localhost --port 10993 --local-bridge; then
            echo "a wrong password was accepted"; exit 1
          fi
          $M --wire /tmp/flomsi-wire.txt probe --email smoke@flomsi.test --host localhost --port 10993 --local-bridge --quick
          if grep -q "$MAIL_PASSWORD" /tmp/flomsi-wire.txt; then echo "password in the transcript"; exit 1; fi
          grep -q "LOGIN \*\*\* (masked)" /tmp/flomsi-wire.txt
      - name: server logs
        if: failure()
        run: |
          sudo cat /tmp/flomsi-live/dovecot.log || true
          docker logs mailpit || true

  app-check:
    name: app (analyze + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  macos:
    name: build macOS
    runs-on: macos-15
    needs: [core, live, app-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - name: package
        run: |
          cd app/build/macos/Build/Products/Release
          ditto -c -k --keepParent Flomsi.app Flomsi-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flomsi-macOS
          path: app/build/macos/Build/Products/Release/Flomsi-macOS.zip

  ios:
    name: build iOS (device, no codesign)
    runs-on: macos-15
    needs: [core, live, app-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --release --no-codesign
        working-directory: app

  android:
    name: build Android
    runs-on: ubuntu-latest
    needs: [core, live, app-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Flomsi-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: build Windows
    runs-on: windows-latest
    needs: [core, live, app-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: package
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath Flomsi-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flomsi-windows
          path: Flomsi-windows.zip
