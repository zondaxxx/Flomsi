name: site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# The site is static files in site/: no build step, the folder is published as it is.
# Pages must be set to "GitHub Actions" as its source, and the custom domain (flomsi.nz)
# is set in the repository's Pages settings; site/CNAME only records it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Current majors, on Node 24. upload-pages-artifact leaves dotfiles out, which is why site/ has no
    # .nojekyll: a deployment from Actions does not run Jekyll anyway.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
