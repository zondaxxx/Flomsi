name: site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# The site is static files in site/: no build step, the folder goes to flomsi.nz as it is.
# The server (168.222.247.31) serves it with Caddy from /var/www/flomsi/current. The deploy
# key in FLOMSI_DEPLOY_KEY can do one thing there: run /usr/local/bin/flomsi-deploy, which
# takes the site as a .tar.gz on stdin, unpacks it beside the last releases and switches
# `current` to it in one step. A broken upload changes nothing.
permissions:
  contents: read

# One deployment at a time, and a running one is allowed to finish.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: publish to flomsi.nz
    runs-on: ubuntu-latest
    environment:
      name: flomsi.nz
      url: https://flomsi.nz
    steps:
      - uses: actions/checkout@v7
      - name: Upload
        env:
          DEPLOY_KEY: ${{ secrets.FLOMSI_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The server's host key, pinned: the upload goes to this machine or nowhere.
          echo '168.222.247.31 ssh-rsa ' > ~/.ssh/known_hosts
          tar -czf - -C site . |
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@168.222.247.31
      - name: Check
        run: |
          curl -fsS --retry 3 https://flomsi.nz/ | grep -q '<title>Flomsi'
          curl -fsS https://flomsi.nz/privacy.html | grep -q 'Limited Use'
