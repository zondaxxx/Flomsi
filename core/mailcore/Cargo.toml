[package]
name = "mailcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mail client core: IMAP sync, SQLite cache, search, threading"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ammonia = "4.2.0"
anyhow = "1.0.104"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures = "0.3.34"
keyring-core = "1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
log = "0.4"
mail-parser = "0.11.9"
mime_guess = "2"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
idna = "1.1.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.9"

# Each platform's own credential store (secrets.rs picks it at first use).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# iOS keeps secrets in the data-protection keychain.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# SharedPreferences encrypted with a Keystore key; needs the app's context (MainActivity).
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
