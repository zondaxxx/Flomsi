[package]
name = "mail_bridge"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge glue between the Flutter app and mailcore"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
mailcore = { path = "../../core/mailcore" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
chrono = "0.4"

# MainActivity hands the app's context to the Rust side (Keystore access for passwords).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Shipped builds carry no debug symbols: the Android library alone was tens of megabytes.
[profile.release]
strip = "debuginfo"

[workspace]

# flutter_rust_bridge's #[frb] expands to cfg(frb_expand) checks.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
