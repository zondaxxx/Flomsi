name: mail_app
description: "Keyboard-first mail client. Rust core, dark glass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  macos_window_utils: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/keymaps/
