name: mail_app
description: "Keyboard-first mail client. Rust core, dark glass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  flutter_widget_from_html_core: ^0.17.4
  macos_window_utils: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/keymaps/
